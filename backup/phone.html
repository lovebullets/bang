<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>K-Tech Oracle X · 하시온</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0d;--p1:#131317;--p2:#1b1b21;--p3:#25252d;--ln:rgba(255,255,255,.07);
  --tx:#ecebef;--sub:#8f8d98;--cr:#b3263a;--cr2:#6d1220;--crg:rgba(179,38,58,.38);
  --cream:#f4e7da;--pink:#f2b8c6;--me:#a01d33;--them:#26262e;
  --sbh:calc(34px + env(safe-area-inset-top));
  --nbh:calc(48px + env(safe-area-inset-bottom));
}
html,body{height:100%;background:#050506;color:var(--tx);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body{display:flex;align-items:center;justify-content:center}
button,input{font:inherit;color:inherit;background:none;border:0;outline:0}
#phone{position:relative;width:100vw;height:100vh;height:100dvh;background:var(--bg);overflow:hidden;isolation:isolate}
@media (min-width:520px){
  #phone{width:400px;height:min(860px,calc(100vh - 40px));border-radius:46px;border:10px solid #000;
    box-shadow:0 0 0 1px #2b2b30,0 30px 80px rgba(0,0,0,.75)}
}
.tap{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  transition:transform .12s ease,background-color .15s ease,opacity .15s ease}
.tap:active{transform:scale(.96);opacity:.82}
.deco{pointer-events:none}

/* ---------- status bar ---------- */
#statusbar{position:absolute;left:0;right:0;top:0;height:var(--sbh);padding:env(safe-area-inset-top) 22px 0;
  display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;z-index:90;pointer-events:none;
  text-shadow:0 1px 3px rgba(0,0,0,.5)}
#statusbar .r{display:flex;align-items:center;gap:6px}
.bat{display:flex;align-items:center;gap:3px}
.bat i{display:block;width:24px;height:11px;border:1.4px solid rgba(255,255,255,.85);border-radius:3px;padding:1.5px;position:relative}
.bat i:after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:4px;background:rgba(255,255,255,.8);border-radius:0 1px 1px 0}
.bat b{display:block;height:100%;width:87%;background:#fff;border-radius:1px}
.sig{display:flex;align-items:flex-end;gap:1.5px;height:11px}
.sig span{width:3px;background:#fff;border-radius:1px}

/* ---------- nav bar ---------- */
#navbar{position:absolute;left:0;right:0;bottom:0;height:var(--nbh);padding-bottom:env(safe-area-inset-bottom);
  display:flex;align-items:center;justify-content:space-around;background:rgba(6,6,8,.94);z-index:80;border-top:1px solid var(--ln)}
#navbar button{width:64px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px}
#navbar button:active{background:rgba(255,255,255,.08)}
#navbar svg{width:20px;height:20px;stroke:#d9d8de;fill:none;stroke-width:2}
#phone.locked #navbar{transform:translateY(100%);pointer-events:none}
#navbar{transition:transform .3s}

/* ---------- toast ---------- */
#toast{position:absolute;left:50%;bottom:calc(var(--nbh) + 18px);transform:translate(-50%,20px);max-width:84%;
  background:rgba(32,32,38,.96);border:1px solid rgba(255,255,255,.08);padding:11px 16px;border-radius:14px;font-size:13.5px;line-height:1.45;
  text-align:center;opacity:0;z-index:95;pointer-events:none;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- lock ---------- */
#lock{position:absolute;inset:0;background:#000;z-index:85;display:flex;flex-direction:column;align-items:center;
  padding:calc(var(--sbh) + 50px) 20px calc(30px + env(safe-area-inset-bottom));transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
#lock.hidden{transform:translateY(-100%);visibility:hidden;pointer-events:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
.lk-time{font-size:78px;font-weight:200;letter-spacing:2px;line-height:1;font-variant-numeric:tabular-nums}
.lk-date{margin-top:10px;font-size:15px;color:#cfcdd6;font-weight:300;letter-spacing:.5px}
.lk-center{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;min-height:160px}
.lk-hit{width:200px;height:200px;border-radius:50%;position:relative;z-index:2}
.pulse{position:absolute;left:50%;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;
  background:radial-gradient(circle,rgba(179,38,58,.75) 0%,rgba(109,18,32,.35) 45%,transparent 70%);opacity:0;pointer-events:none;z-index:1}
.pulse.go{animation:pulse 2.4s ease-out}
.pulse.go2{animation:pulse 2.4s ease-out .9s}
@keyframes pulse{0%{transform:scale(.4);opacity:0}15%{opacity:.95}100%{transform:scale(9);opacity:0}}
.lk-bottom{display:flex;flex-direction:column;align-items:center;gap:10px}
.fp{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12)}
.fp svg{width:38px;height:38px;stroke:#d8d6de;fill:none;stroke-width:1.4}
.lk-link{min-height:44px;padding:0 18px;font-size:13px;color:#9c9aa5;border-radius:22px}
#pinpad{position:absolute;inset:0;background:rgba(0,0,0,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--sbh) + 10px) 20px calc(24px + env(safe-area-inset-bottom));opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s,visibility 0s linear .2s;z-index:5}
#pinpad.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s}
.pin-ttl{font-size:15px;color:#cfcdd6}
.pin-hint{font-size:12px;color:#6f6d78;margin-top:6px}
.dots{display:flex;gap:14px;margin:22px 0 28px}
.dots i{width:12px;height:12px;border-radius:50%;border:1.4px solid #bbb}
.dots i.f{background:#fff;border-color:#fff}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:16px 26px}
.keys button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.07);font-size:28px;font-weight:300}
.keys button.txt{background:none;font-size:14px;color:#aaa}

/* ---------- home ---------- */
#home{position:absolute;left:0;right:0;top:0;bottom:var(--nbh);z-index:1;display:flex;flex-direction:column;padding:calc(var(--sbh) + 8px) 16px 12px}
.wall{position:absolute;inset:0;z-index:0;overflow:hidden}
.wall svg{width:100%;height:100%;display:block}
.wall:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%)}
.hm{position:relative;z-index:2;display:flex;flex-direction:column;height:100%}
.widgets{display:flex;gap:10px}
.wg{flex:1;min-width:0;min-height:92px;border-radius:22px;padding:12px 14px;background:rgba(20,20,24,.28);
  border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;justify-content:space-between}
.wg .a{font-size:12px;color:rgba(255,255,255,.85)}
.wg .b{font-size:30px;font-weight:300;line-height:1.05}
.wg .c{font-size:11.5px;color:rgba(255,255,255,.75)}
.dday .b{font-size:24px;font-weight:500;color:#fff}
.dday .b em{font-style:normal;color:var(--pink)}
.spacer{flex:1}
.folders{display:flex;justify-content:flex-end;gap:14px;margin-bottom:16px}
.fold{width:74px;display:flex;flex-direction:column;align-items:center;gap:6px}
.fold .box{width:64px;height:64px;border-radius:18px;background:rgba(30,30,36,.45);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:8px}
.fold .box span{border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px}
.fold .lbl,.ic-wrap .lbl{font-size:11.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:74px}
.dock{display:flex;justify-content:space-around;padding:10px 6px;border-radius:28px;background:rgba(18,18,22,.42);
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.ic svg{width:28px;height:28px}
.ic .badge{position:absolute;top:-5px;right:-7px;min-width:22px;height:20px;padding:0 5px;border-radius:10px;background:#e0283f;color:#fff;
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #111}
.ic-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;padding:4px 0;border-radius:14px}

/* folder overlay */
#fov{position:absolute;left:0;right:0;top:0;bottom:var(--nbh);z-index:40;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s,visibility 0s linear .22s}
#fov.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .22s}
.fbg{position:absolute;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.fpanel{position:relative;z-index:2;width:min(330px,88%);transform:scale(.9);transition:transform .22s}
#fov.on .fpanel{transform:scale(1)}
.fname{text-align:center;font-size:24px;font-weight:600;margin-bottom:16px;color:#fff}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px;padding:20px 12px;border-radius:30px;background:rgba(40,40,48,.6);border:1px solid rgba(255,255,255,.1)}
.fgrid .ic-wrap{width:auto}

/* ---------- screens ---------- */
#screens{position:absolute;left:0;right:0;top:0;bottom:var(--nbh);z-index:10;pointer-events:none}
.screen{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--sbh);
  transform:translateX(100%);visibility:hidden;pointer-events:none;
  transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s}
.screen.active{transform:translateX(0);visibility:visible;pointer-events:auto;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s}
.screen.active.under{transform:translateX(-22%)}
.appbar{flex:0 0 auto;height:54px;display:flex;align-items:center;gap:4px;padding:0 8px;border-bottom:1px solid var(--ln)}
.appbar .back{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.appbar .back svg{width:22px;height:22px;stroke:var(--tx);fill:none;stroke-width:2.2}
.appbar h1{flex:1;min-width:0;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .right{display:flex;gap:2px}
.appbar .right button{min-width:44px;height:44px;border-radius:22px;padding:0 10px;font-size:13px;color:var(--sub)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:16px}
.sec{font-size:12px;color:var(--sub);padding:18px 16px 8px;letter-spacing:.3px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.row:active{background:var(--p2)}
.av{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--p3);font-weight:600}
.mid{flex:1;min-width:0}
.t1{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:13px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2.wrap{white-space:normal}
.rt{flex:0 0 auto;font-size:12px;color:var(--sub);text-align:right}
.pinmark{font-size:11px;color:var(--pink);margin-left:4px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:18px;background:var(--p2);border:1px solid var(--ln);font-size:13px;margin:0 6px 8px 0}
.chip.on{background:var(--cr2);border-color:var(--cr)}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:var(--cr);color:#fff;font-weight:600;width:100%;font-size:15px}
.btn.ghost{background:var(--p2);color:var(--tx);border:1px solid var(--ln)}
.empty{padding:60px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7}
.tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:8px;background:var(--p3);color:#cfcdd6;margin-right:4px}
.tag.cr{background:rgba(179,38,58,.2);color:#ff8a9a}
.chk{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 16px;border-bottom:1px solid var(--ln);width:100%;text-align:left}
.chk .box{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:1.5px solid #555;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.chk.on .box{background:var(--cr);border-color:var(--cr);color:#fff}
.chk.on .mid .t1{color:var(--sub);text-decoration:line-through}

/* messenger */
.msgs{padding:6px 10px 20px;display:flex;flex-direction:column}
.dv{align-self:center;text-align:center;font-size:11px;color:var(--sub);margin:18px 0 10px;font-weight:500;letter-spacing:.2px}
.dv b{font-weight:700;color:#bdbbc6}
.ln{display:flex;margin-bottom:3px}
.ln.last{margin-bottom:10px}
.ln.me{justify-content:flex-end;padding-right:10px}
.ln.them{justify-content:flex-start;padding-left:10px}
.bw{position:relative;max-width:78%;z-index:0}
.bub{position:relative;z-index:1;padding:8px 14px;border-radius:18px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;letter-spacing:-.01em;word-break:break-word}
.ln.me .bub{background:var(--me);color:#fff}
.ln.them .bub{background:var(--them);color:var(--tx)}
.ln.me.last .bw::before{content:"";position:absolute;right:-6px;bottom:0;width:20px;height:20px;background:var(--me);border-bottom-left-radius:15px;z-index:-1}
.ln.me.last .bw::after{content:"";position:absolute;right:-10px;bottom:0;width:10px;height:20px;background:var(--bg);border-bottom-left-radius:10px;z-index:0}
.ln.them.last .bw::before{content:"";position:absolute;left:-6px;bottom:0;width:20px;height:20px;background:var(--them);border-bottom-right-radius:15px;z-index:-1}
.ln.them.last .bw::after{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:20px;background:var(--bg);border-bottom-right-radius:10px;z-index:0}
.inbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;border-top:1px solid var(--ln);background:var(--p1)}
.inbar .plus{width:44px;height:44px;border-radius:50%;background:var(--p3);color:var(--sub);font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.inbar .pill{flex:1;min-width:0;display:flex;align-items:center;height:48px;border-radius:24px;border:1px solid var(--ln);background:var(--p2);padding:0 2px 0 16px}
.inbar input{flex:1;min-width:0;height:100%;font-size:16px;background:none;padding:0}
.inbar .sendb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.inbar .sendb i{display:flex;width:32px;height:32px;border-radius:50%;background:var(--me);align-items:center;justify-content:center}
.inbar svg{width:17px;height:17px;fill:#fff}

/* calls */
.tabs{display:flex;gap:8px;padding:12px 16px 4px}
.ctype{font-size:12px}
.miss .t1{color:#ff5a6e}
.cbtns{display:flex;gap:12px;padding:0 16px 8px}
.cbtns .btn{flex:1}
.bigav{width:96px;height:96px;border-radius:50%;margin:26px auto 12px;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--p3)}
.cname-big{text-align:center;font-size:22px;font-weight:600}
.cnum{text-align:center;color:var(--sub);font-size:14px;margin:6px 0 14px}
.calling{background:radial-gradient(ellipse at 50% 30%,#2a0c12 0%,#0b0b0d 70%)}
.calling .appbar{border:0}
.callc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:30px 20px 34px}
.callc .tmr{color:var(--sub);font-size:15px;margin-top:8px;font-variant-numeric:tabular-nums}
.cctl{display:grid;grid-template-columns:repeat(3,72px);gap:22px}
.cctl button{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.08);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.cctl button.on{background:#fff;color:#111}
.endc{width:76px;height:76px;border-radius:50%;background:#e0283f;display:flex;align-items:center;justify-content:center;margin-top:26px}
.endc svg{width:32px;height:32px;fill:#fff;transform:rotate(135deg)}

/* gallery */
.album{display:flex;gap:14px;align-items:center;padding:10px 16px;min-height:96px;width:100%;text-align:left;border-bottom:1px solid var(--ln)}
.cover{width:76px;height:76px;border-radius:14px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.th{aspect-ratio:1/1;position:relative;display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;width:100%}
.th .vd{position:absolute;right:5px;bottom:4px;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:1px 5px;border-radius:5px}
.th .hrt{position:absolute;left:5px;bottom:3px;font-size:11px}
.pframe{margin:14px 16px 0;aspect-ratio:3/4;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative;overflow:hidden}
.pframe .light{position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,240,215,.35) 0%,transparent 45%);pointer-events:none}
.pframe .play{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;bottom:16px;right:16px}
.pframe .vbar{position:absolute;left:16px;right:96px;bottom:44px;height:3px;background:rgba(255,255,255,.3);border-radius:2px;overflow:hidden;pointer-events:none}
.pframe .vbar b{display:block;height:100%;width:0;background:#fff}
.pinfo{padding:14px 18px}
.pinfo .cap{font-size:17px;font-weight:600}
.pinfo .meta{font-size:12.5px;color:var(--sub);margin-top:6px}
.pnav{display:flex;gap:10px;padding:4px 16px 20px}
.pnav button{flex:1;min-height:48px;border-radius:14px;background:var(--p2);border:1px solid var(--ln);font-size:14px}
.pnav button.lk.on{color:#ff6b80}
.storage .bar{height:8px;border-radius:4px;background:var(--p3);overflow:hidden;display:flex;margin:10px 0 6px}
.storage .bar i{display:block;height:100%}

/* memo */
.memo-d{padding:18px 18px 40px}
.memo-d h2{font-size:22px;font-weight:600}
.memo-d .dt{font-size:12px;color:var(--sub);margin:6px 0 18px}
.memo-d .ct{font-size:15.5px;line-height:1.8;white-space:pre-wrap}
.memo-d .ct.none{color:#4f4d57}

/* melon */
.pl{display:flex;gap:14px;align-items:center;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--ln);min-height:92px}
.plc{width:68px;height:68px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:28px}
.trk{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;width:100%;text-align:left;border-bottom:1px solid var(--ln)}
.trk .no{width:22px;color:var(--sub);font-size:13px;text-align:center;flex:0 0 auto}
.trk.cur .t1{color:#5be38f}
.np{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p1);border-top:1px solid var(--ln);position:relative}
.np .art{width:42px;height:42px;border-radius:8px;background:linear-gradient(135deg,#1f3b2c,#0d1a13);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.np .pp{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--p3);flex:0 0 auto}
.np .prog{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.08);pointer-events:none}
.np .prog b{display:block;height:100%;width:0;background:#5be38f}

/* netflix */
.nfp{display:flex;justify-content:center;gap:26px;padding:60px 20px 20px}
.nfp button{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:96px;padding:6px;border-radius:14px}
.nfp .pic{width:92px;height:92px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px}
.hrow{display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.poster{flex:0 0 auto;width:112px;aspect-ratio:2/3;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;font-size:12px;font-weight:600;text-align:left;line-height:1.3;position:relative;overflow:hidden}
.poster .pb{position:absolute;left:0;bottom:0;height:3px;background:#e50914;pointer-events:none}

/* zero point */
.zstat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.zstat div{background:var(--p2);border-radius:14px;padding:12px 8px;text-align:center}
.zstat b{display:block;font-size:20px;font-weight:600}
.zstat span{font-size:11px;color:var(--sub)}
.zfield{position:relative;height:260px;border-radius:18px;background:radial-gradient(circle at 50% 50%,#132018 0%,#070b09 80%);overflow:hidden;border:1px solid var(--ln)}
.zfield .cross{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(transparent calc(50% - .5px),rgba(91,227,143,.25) calc(50% - .5px),rgba(91,227,143,.25) calc(50% + .5px),transparent calc(50% + .5px)),
  linear-gradient(90deg,transparent calc(50% - .5px),rgba(91,227,143,.25) calc(50% - .5px),rgba(91,227,143,.25) calc(50% + .5px),transparent calc(50% + .5px))}
#ztarget{position:absolute;width:48px;height:48px;border-radius:50%;left:calc(50% - 24px);top:calc(50% - 24px);
  background:radial-gradient(circle,#ff4d62 0 18%,#fff 19% 34%,#ff4d62 35% 52%,#fff 53% 70%,#ff4d62 71%);transition:left .18s,top .18s}

/* radar */
.radar{position:relative;width:min(260px,72vw);aspect-ratio:1/1;margin:10px auto 18px;border-radius:50%;
  background:radial-gradient(circle,rgba(179,38,58,.08) 0 24%,transparent 24.5% 49%,rgba(179,38,58,.06) 49.5% 74%,transparent 74.5%),#0f0a0c;
  border:1px solid rgba(179,38,58,.4);overflow:hidden}
.radar .sw{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(179,38,58,.55),transparent 22%);animation:spin 3.6s linear infinite;pointer-events:none}
.radar .ring{position:absolute;border:1px dashed rgba(255,255,255,.12);border-radius:50%;pointer-events:none}
.radar .home{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;pointer-events:none}
.radar .far{position:absolute;width:7px;height:7px;border-radius:50%;background:#555;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* sleep / pink */
.cam{position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#3a2c22,#15100c);width:100%;display:block;transition:aspect-ratio .3s}
.cam.zoom{aspect-ratio:3/4}
.cam .live{position:absolute;left:10px;top:10px;font-size:11px;background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px;display:flex;align-items:center;gap:5px;pointer-events:none}
.cam .live i{width:7px;height:7px;border-radius:50%;background:#ff3b4f;animation:blink 1.4s infinite}
.cam .zzz{position:absolute;right:14px;top:12px;font-size:13px;color:#e9dccd;animation:breathe 4s ease-in-out infinite;pointer-events:none}
.cam .scene{position:absolute;inset:0;pointer-events:none}
.cam .scene svg{width:100%;height:100%}
@keyframes blink{50%{opacity:.2}}
@keyframes breathe{50%{opacity:.35;transform:translateY(-3px)}}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.bars button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;min-width:0}
.bars b{display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#9c8ad8,#4f3f8f)}
.bars span{font-size:10.5px;color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:11px;color:var(--sub);padding:4px 0}
.cal button{aspect-ratio:1/1;border-radius:50%;font-size:13px;display:flex;align-items:center;justify-content:center;min-height:36px}
.cal button.per{background:rgba(242,120,150,.25);color:#ffb3c4}
.cal button.today{box-shadow:inset 0 0 0 2px #ff7d9a}
.cal button.ov{background:rgba(120,170,255,.16)}
.cal .x{visibility:hidden}

/* camera */
.camscr{background:#000}
.camscr .appbar{border:0}
.vf{flex:1;position:relative;margin:0 0 0;background:radial-gradient(ellipse at 50% 40%,#1b1b20,#050506);overflow:hidden}
.vf .grid3{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.14) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.14) 66.6%,transparent 66.8%),
  linear-gradient(transparent 33.2%,rgba(255,255,255,.14) 33.3%,transparent 33.5%,transparent 66.5%,rgba(255,255,255,.14) 66.6%,transparent 66.8%)}
.vf .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.vf .flash.go{animation:flash .35s}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
.vf .focus{position:absolute;left:50%;top:45%;width:70px;height:70px;margin:-35px;border:1.5px solid rgba(255,214,90,.8);border-radius:6px;pointer-events:none}
.cmodes{display:flex;justify-content:center;gap:6px;padding:10px 0 4px}
.cmodes button{min-height:40px;padding:0 14px;font-size:13px;color:#999;border-radius:20px}
.cmodes button.on{color:#ffd65a;font-weight:600}
.cbar{display:flex;align-items:center;justify-content:space-around;padding:10px 20px 18px}
.shut{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center}
.shut i{display:block;width:60px;height:60px;border-radius:50%;background:#fff;transition:background .2s}
.shut.rec i{background:#e0283f;width:30px;height:30px;border-radius:8px}
.cside{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px}
.cthumb{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#f6dcc3,#c98f78);display:flex;align-items:center;justify-content:center;font-size:20px}

/* bank */
.bal{font-size:28px;font-weight:600;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.amt{font-variant-numeric:tabular-nums}
.amt.in{color:#7fb5ff}

@media (max-width:360px){
  .lk-time{font-size:64px}
  .ic{width:50px;height:50px;font-size:23px}
  .ic-wrap{width:64px}
  .fold .box{width:58px;height:58px}
  .keys{grid-template-columns:repeat(3,64px);gap:12px 20px}
  .keys button{width:64px;height:64px}

  .cctl button{width:64px;height:64px}
  .wg .b{font-size:26px}.dday .b{font-size:20px}
}
@media (max-height:640px){
  .lk-time{font-size:60px}

  .bigav{width:76px;height:76px;margin-top:14px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

      '<div class="cbar"><button class="cthumb tap" data-act="camgal" aria-label="갤러리">🐰</button><button class="shut tap' + (recOn ? ' rec' : '') + '" data-act="shutter" aria-label="촬영"><i></i></button><button class="cside tap" data-act="cflip" aria-label="전후면 전환">⟲</button></div>';
  }

  /* ================= build all screens ================= */
  mk('scr-messenger', 'K-Messenger', { right: '<button class="tap" data-act="toast" data-msg="알림 배지 0 · 모두 읽음">⋯</button>' });
  mk('scr-chat', '', { foot: '<div class="inbar"><button class="plus tap" data-act="toast" data-msg="첨부는 사용할 수 없어요" aria-label="첨부">+</button><div class="pill"><input id="chat-in" placeholder="메시지" autocomplete="off"><button class="sendb tap" data-act="send" aria-label="보내기"><i>' + SEND_SVG + '</i></button></div></div>' });
  mk('scr-sms', '메시지');
  mk('scr-phone', '전화', { right: '<button class="tap" data-act="contact" data-c="minjung">★</button>' });
  mk('scr-contact', '연락처');
  mk('scr-calling', '', { cls: 'calling' });
  mk('scr-gallery', '갤러리');
  mk('scr-album', '');
  mk('scr-photo', '');
  mk('scr-memo', '메모');
  mk('scr-memo-d', '메모');
  mk('scr-melon', 'Melon', { foot: npHtml() });
  mk('scr-playlist', '', { foot: npHtml() });
  mk('scr-netflix', 'Netflix');
  mk('scr-nfp', '');
  mk('scr-delivery', 'K-Delivery');
  mk('scr-store', '');
  mk('scr-fresh', 'Fresh-Morning');
  mk('scr-lux', 'K-Lux');
  mk('scr-pet', 'Pet-Forest');
  mk('scr-sleep', 'Sweet-Dream');
  mk('scr-pink', 'Pink-Diary');
  mk('scr-zero', 'Zero-Point');
  mk('scr-fnet', 'FEARLESS-Net');
  mk('scr-notice', '');
  mk('scr-radar', 'Gate-Radar');
  mk('scr-bank', 'K-Private Bank');
  mk('scr-camera', '', { cls: 'camscr' });

  var renders = [renderHome, renderMessenger, renderSms, renderCalls, renderGallery, renderMemo, renderMelon, renderNetflix,
    renderDelivery, renderFresh, renderLux, renderPet, renderSleep, renderPink, renderZero, renderFnet, renderRadar, renderBank, renderCamera];
  renders.forEach(function (fn) { try { fn(); } catch (e) { if (window.console) console.error(e); } });
  updateNP();

  /* ================= lock ================= */
  var isLocked = true, pinBuf = '';
  function unlock() {
    isLocked = false;
    closePin();
    $('lock').classList.add('hidden');
    $('phone').classList.remove('locked');
  }
  function lockNow() {
    goHome();
    isLocked = true;
    pinBuf = ''; drawDots();
    $('lock').classList.remove('hidden');
    $('phone').classList.add('locked');
  }
  function drawDots() {
    var ds = $('dots').querySelectorAll('i');
    for (var i = 0; i < ds.length; i++) ds[i].classList.toggle('f', i < pinBuf.length);
  }
  function openPin() { pinBuf = ''; drawDots(); $('pinpad').classList.add('on'); }
  function closePin() { $('pinpad').classList.remove('on'); }
  $('keys').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(function (k) {
    return '<button class="tap" data-act="pin" data-k="' + k + '">' + k + '</button>';
  }).join('') + '<button class="txt tap" data-act="pincancel">취소</button><button class="tap" data-act="pin" data-k="0">0</button><button class="txt tap" data-act="pindel">지우기</button>';
  function pinPress(k) {
    if (pinBuf.length >= 6) return;
    pinBuf += k; drawDots();
    if (pinBuf.length === 6) {
      if (pinBuf === '260102') { setTimeout(unlock, 120); }
      else {
        var d = $('dots');
        d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
        setTimeout(function () { pinBuf = ''; drawDots(); }, 380);
      }
    }
  }
  function lockPulse() {
    ['pulse1', 'pulse2'].forEach(function (id, i) {
      var p = $(id); if (!p) return;
      p.classList.remove('go', 'go2'); void p.offsetWidth; p.classList.add(i ? 'go2' : 'go');
    });
  }

  /* ================= event delegation ================= */
  var lastTap = 0;
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    var now = Date.now();
    if (act !== 'pin' && act !== 'zshot' && act !== 'lockpulse' && now - lastTap < 120) return;
    lastTap = now;
    var ds = t.dataset;
    try {
      switch (act) {
        case 'back': goBack(); break;
        case 'home': if (!isLocked) goHome(); break;
        case 'lock': lockNow(); break;
        case 'lockpulse': lockPulse(); break;
        case 'finger': toast('지문 인식됨'); setTimeout(unlock, 200); break;
        case 'pinopen': openPin(); break;
        case 'pincancel': closePin(); break;
        case 'pindel': pinBuf = pinBuf.slice(0, -1); drawDots(); break;
        case 'pin': pinPress(ds.k); break;
        case 'folder': openFolder(ds.id); break;
        case 'fclose': closeFolder(); break;
        case 'app': openApp(ds.id); break;
        case 'toast': toast(ds.msg || ''); break;
        case 'dday': openApp('gallery'); openAlbum('mine'); break;
        case 'chat': openChat(ds.src, ds.id); break;
        case 'send': sendMsg(); break;
        case 'ctab': callFilter = ds.f; renderCalls(); break;
        case 'contact': openContact(ds.c); break;
        case 'dial': dial(ds.c); break;
        case 'cmsg':
          var ct = CONTACTS[ds.c];
          if (ct && ct.chat) openChat(ct.chat[0], ct.chat[1]); else toast('저장되지 않은 번호입니다');
          break;
        case 'ctog': t.classList.toggle('on'); break;
        case 'endcall': stopCall(); toast('통화 종료 · ' + pad2(Math.floor(callSec / 60)) + ':' + pad2(callSec % 60)); goBack(); break;
        case 'album': openAlbum(ds.a); break;
        case 'photo': curPhoto = parseInt(ds.i, 10) || 0; renderPhoto(); openScreen('scr-photo'); break;
        case 'pnav':
          var n = ALBUMS[curAlbum].photos.length;
          curPhoto = (curPhoto + parseInt(ds.d, 10) + n) % n; renderPhoto(); break;
        case 'like':
          var ph = ALBUMS[curAlbum].photos[curPhoto]; ph.like = !ph.like; renderPhoto();
          var al = $('scr-album'); if (al && al.classList.contains('active')) {
            var th = body('scr-album').querySelectorAll('.th')[curPhoto];
            if (th) { var hr = th.querySelector('.hrt'); if (ph.like && !hr) th.insertAdjacentHTML('beforeend', '<span class="hrt">♥</span>'); if (!ph.like && hr) hr.remove(); }
          }
          break;
        case 'vplay': playVid(); break;
        case 'memo': openMemo(parseInt(ds.i, 10)); break;
        case 'pl': openPl(ds.id); break;
        case 'trk': playTrack(curPl, parseInt(ds.i, 10)); break;
        case 'pp':
          if (!np.pl) { playTrack('drive', 0); toast('Drive 재생'); }
          else { np.playing = !np.playing; updateNP(); renderPl(); }
          break;
        case 'nexttrk':
          if (!np.pl) playTrack('drive', 0);
          else playTrack(np.pl, (np.i + 1) % PLAYLISTS[np.pl].tracks.length);
          break;
        case 'nfp': openNfp(ds.p); break;
        case 'dlsearch':
          var q = ($('dl-in').value || '').trim();
          if (!q) { toast('검색어를 입력하세요'); break; }
          var hit = STORES.filter(function (s) { return s.n.indexOf(q) !== -1 || s.menu.some(function (m) { return m[0].indexOf(q) !== -1 || q.indexOf(m[0]) !== -1; }); });
          if (hit.length) { toast('‘' + q + '’ 검색 결과 ' + hit.length + '곳 · ' + hit[0].n); openStore(STORES.indexOf(hit[0])); }
          else toast('‘' + q + '’ 검색 결과가 없습니다');
          break;
        case 'dlterm': $('dl-in').value = DL_TERMS[parseInt(ds.i, 10)] || ''; toast('최근 검색어 입력됨 · 검색을 눌러주세요'); break;
        case 'store': openStore(parseInt(ds.i, 10)); break;
        case 'addcart':
          cart++;
          var ob = $('order-btn'); if (ob) ob.textContent = '담은 메뉴 ' + cart + '개 · 주문하기';
          toast(STORES[curStore].menu[parseInt(ds.i, 10)][0] + ' 담음');
          break;
        case 'order':
          if (!cart) { toast('메뉴를 먼저 담아주세요'); break; }
          toast('주문 완료 · 약 30분 후 도착 · 문 앞에 두기');
          cart = 0; var ob2 = $('order-btn'); if (ob2) ob2.textContent = '담은 메뉴 0개 · 주문하기';
          break;
        case 'chk': t.classList.toggle('on'); break;
        case 'camzoom': t.classList.toggle('zoom'); break;
        case 'zshot':
          zScore++;
          var zs = $('zscore'); if (zs) zs.textContent = zScore;
          t.style.left = (8 + Math.random() * 74) + '%';
          t.style.top = (8 + Math.random() * 70) + '%';
          break;
        case 'zreset': zScore = 0; var zs2 = $('zscore'); if (zs2) zs2.textContent = '0'; toast('점수 초기화'); break;
        case 'notice': openNotice(parseInt(ds.i, 10)); break;
        case 'bankeye': bankShow = !bankShow; renderBank(); break;
        case 'cmode': camMode = ds.m; recOn = false; renderCamera(); break;
        case 'cflip': toast('전면 카메라 전환'); break;
        case 'camgal': openApp('gallery'); openAlbum('mine'); break;
        case 'shutter':
          if (camMode === 'video') {
            recOn = !recOn; renderCamera(); toast(recOn ? '4K 녹화 시작' : '녹화 저장됨 · 갤러리');
          } else {
            var f = $('flash'); if (f) { f.classList.remove('go'); void f.offsetWidth; f.classList.add('go'); }
            toast('사진이 저장되었습니다');
          }
          break;
        default: break;
      }
    } catch (err) {
      if (window.console) console.error(err);
    }
  });

  var chatIn = $('chat-in');
  if (chatIn) chatIn.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendMsg(); } });
  var dlIn = $('dl-in');
  if (dlIn) dlIn.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); var b = document.querySelector('[data-act="dlsearch"]'); if (b) b.click(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') goBack();
    if (isLocked && $('pinpad').classList.contains('on')) {
      if (/^[0-9]$/.test(e.key)) pinPress(e.key);
      if (e.key === 'Backspace') { pinBuf = pinBuf.slice(0, -1); drawDots(); }
    }
  });

  /* ================= clock / dday (decorative, isolated) ================= */
  function tick() {
    try {
      var d = new Date();
      var h = d.getHours(), m = pad2(d.getMinutes());
      $('sb-time').textContent = h + ':' + m;
      $('lk-time').textContent = pad2(h) + ':' + m;
      var wd = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
      $('lk-date').textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + wd + '요일';
      var start = new Date(2026, 0, 2);
      var today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      var n = Math.round((today - start) / 86400000) + 1;
      if (n > 0) $('dday-n').textContent = n;
    } catch (e) {}
  }
  tick();
  setInterval(tick, 1000);
});
</script>
</body>
</html>
