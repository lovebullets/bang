<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Memory Text Archive</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <style>
        /* =======================================
           🔥 CSS: 흰색 배경(Light Theme) 오토메 감성 설정
           ======================================= */
        * { 
            margin: 0; padding: 0; box-sizing: border-box; user-select: none; 
            -webkit-tap-highlight-color: transparent; 
            font-family: 'Noto Serif KR', serif !important;
        }

        body, html {
            width: 100%; height: 100dvh; overflow: hidden;
            background-color: #FAFAFA; 
            color: #1B1B1B; 
        }

        @keyframes pageFadeIn {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0); }
        }

        #archive-container {
            width: 100vw; height: 100dvh; display: flex; flex-direction: column;
            animation: pageFadeIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* === 헤더 및 검색창 === */
        header {
            width: 100%; padding: max(15px, env(safe-area-inset-top)) 20px 10px 20px;
            display: flex; flex-direction: column; gap: 15px;
            background: rgba(250, 250, 250, 0.85);
            backdrop-filter: blur(12px); 
            z-index: 50; position: relative;
            border-bottom: 1px solid rgba(0, 0, 0, 0.03);
        }
        .header-top { display: flex; align-items: center; justify-content: space-between; height: 35px; }
        .back-btn {
            color: #1B1B1B; text-decoration: none; font-size: 24px;
            display: flex; align-items: center; transition: transform 0.2s;
        }
        .back-btn:active { transform: scale(0.85) translateX(-3px); }

        .search-box-wrapper {
            display: flex; align-items: center;
            background: rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px; padding: 4px 12px; width: 140px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .search-box-wrapper:focus-within {
            width: 180px; background: #FFF; border-color: rgba(0, 0, 0, 0.15);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .search-box-wrapper iconify-icon { font-size: 16px; color: rgba(27, 27, 27, 0.5); margin-right: 6px; }
        .search-input {
            width: 100%; background: none; border: none; outline: none;
            color: #1B1B1B; font-size: 11px; font-weight: 600;
        }
        .search-input::placeholder { color: rgba(27, 27, 27, 0.4); }

        /* === 카테고리 탭 === */
        .tab-menu { display: flex; justify-content: center; gap: 35px; width: 100%; }
        .tab-item {
            font-size: 13px; font-weight: 600; color: rgba(27, 27, 27, 0.3);
            cursor: pointer; padding-bottom: 6px; position: relative; letter-spacing: 1.5px;
            transition: all 0.3s;
        }
        .tab-item.active { color: #1B1B1B; font-weight: 700; }
        .tab-item::after {
            content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 2px;
            background-color: #1B1B1B; transition: all 0.3s; transform: translateX(-50%);
        }
        .tab-item.active::after { width: 100%; }

        /* === 태그 필터 (포인트 컬러 적용) === */
        .tag-filter-container-wrapper { position: relative; padding: 12px 45px 12px 20px; }
        .tag-filter-pool {
            display: none; justify-content: center; gap: 8px; flex-wrap: wrap; 
            max-height: 26px; overflow: hidden; transition: max-height 0.4s;
        }
        .tag-filter-pool.active { display: flex; }
        .tag-filter-pool.expanded { max-height: 300px; }
        
        .filter-tag-btn {
            background: #FFF; border: 1px solid rgba(0,0,0,0.08);
            padding: 4px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 600; /* 너무 두껍지 않게 조절 */
            color: rgba(27,27,27,0.5); letter-spacing: 0.3px;
            cursor: pointer; transition: all 0.25s ease; 
        }
        /* 🔥 유저 요청: 태그 활성화 시 뱅의 민트 포인트 컬러 */
        .filter-tag-btn.active {
            background: #E1F9F1; color: #46A982; border-color: #E1F9F1;
        }
        .tag-expand-btn {
            position: absolute; top: 11px; right: 15px; width: 26px; height: 26px;
            display: none; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.03); border-radius: 50%; color: #1B1B1B;
            cursor: pointer; transition: all 0.3s;
        }
        .tag-expand-btn.active iconify-icon { transform: rotate(180deg); }

        /* === 리스트 컨테이너 === */
        .slider-wrapper { flex: 1; width: 100%; overflow: hidden; position: relative; }
        .slider-track {
            display: flex; width: 400%; height: 100%;
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .tab-content {
            width: 25%; height: 100%; overflow-y: auto;
            padding: 15px 20px max(50px, env(safe-area-inset-bottom)) 20px;
            display: flex; flex-direction: column; gap: 24px; /* 카드 사이 간격 미세 확장 */
        }
        .tab-content::-webkit-scrollbar { display: none; }

        /* =======================================
           🔥 기억의 파편(텍스트 아카이브) - 접은 글 UI
           ======================================= */
        .text-card {
            width: 100%; display: flex; flex-direction: column; 
            padding-bottom: 16px; border-bottom: 1px solid rgba(0,0,0,0.04);
            opacity: 0; transform: translateY(15px);
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* 애니메이션 충돌 방지를 위해 한번 나타나면 고정 */
        .text-card.show { opacity: 1; transform: translateY(0); }
        
        .card-header {
            display: flex; justify-content: space-between; align-items: baseline; width: 100%;
            cursor: pointer; padding: 4px 0;
            transition: opacity 0.2s;
        }
        .card-header:active { opacity: 0.6; }
        
        .text-title {
            font-size: 15px; font-weight: 700; color: #1B1B1B; /* 볼드 굵기 완화 */
            letter-spacing: 0.2px; flex: 1; line-height: 1.4;
            transition: color 0.3s;
        }
        .text-card.open .text-title { color: #46A982; /* 열렸을 때 민트색 포인트 */ }
        
        .text-date {
            font-size: 11px; color: rgba(27,27,27,0.4); font-weight: 600;
            white-space: nowrap; margin-left: 12px; letter-spacing: 0.5px;
        }

        /* 🔥 스르륵 열리는 아코디언 애니메이션을 위한 Grid 트릭 */
        .card-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
        }
        .text-card.open .card-body {
            grid-template-rows: 1fr;
        }
        .card-body-inner {
            min-height: 0; display: flex; flex-direction: column; gap: 16px; /* 내부 간격 확장 */
            opacity: 0; padding-top: 0;
            transition: opacity 0.4s ease, padding 0.4s ease;
        }
        .text-card.open .card-body-inner {
            opacity: 1; padding-top: 14px; padding-bottom: 4px;
        }

        .text-summary {
            font-size: 12px; color: rgba(27,27,27,0.6); 
            line-height: 1.6; letter-spacing: 0.3px; /* 자간 및 줄간격 확장 */
            word-break: keep-all;
        }

        /* 형광펜 대사 스레드 연출 */
        .highlight-thread-box {
            display: flex; flex-direction: column; gap: 12px; /* 대사 간격 넓힘 */
            padding-left: 20px;
            border-left: 2px solid rgba(0,0,0,0.06); 
        }
        .highlight-item {
            position: relative; font-size: 13px; 
            line-height: 1.7; letter-spacing: 0.4px; /* 대사 가독성 극대화 */
            word-break: keep-all; color: #1B1B1B;
        }
        .highlight-item::before {
            content: ''; position: absolute; left: -20px; top: 11px;
            width: 12px; height: 1px; background: rgba(0,0,0,0.12);
        }
        .highlight-item span {
            display: inline-block; padding: 2px 6px; border-radius: 4px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
        }

        @media (min-width: 768px) {
            .tab-content { padding: 25px 40px 50px; max-width: 800px; margin: 0 auto; }
            .text-title { font-size: 16px; }
            .highlight-item { font-size: 14px; }
        }
    </style>
</head>
<body>

<div id="archive-container">
    <header>
        <div class="header-top">
            <a href="../memory/" class="back-btn"><iconify-icon icon="solar:alt-arrow-left-linear"></iconify-icon></a>
            <div class="search-box-wrapper">
                <iconify-icon icon="solar:magnifer-linear"></iconify-icon>
                <input type="text" id="memory-search-input" class="search-input" placeholder="대사 검색..." autocomplete="off">
            </div>
        </div>
        <div class="tab-menu">
            <div class="tab-item active" onclick="switchTab(0)">DAILY</div>
            <div class="tab-item" onclick="switchTab(1)">EVENT</div>
            <div class="tab-item" onclick="switchTab(2)">AU</div>
            <div class="tab-item" onclick="switchTab(3)">OOC</div>
        </div>
    </header>

    <div class="tag-filter-container-wrapper">
        <div class="tag-filter-pool active" id="tag-pool-daily"><div class="filter-tag-btn active" onclick="filterByTag('all')">ALL</div></div>
        <div class="tag-filter-pool" id="tag-pool-event"><div class="filter-tag-btn active" onclick="filterByTag('all')">ALL</div></div>
        <div class="tag-filter-pool" id="tag-pool-au"><div class="filter-tag-btn active" onclick="filterByTag('all')">ALL</div></div>
        <div class="tag-filter-pool" id="tag-pool-ooc"><div class="filter-tag-btn active" onclick="filterByTag('all')">ALL</div></div>
        
        <div class="tag-expand-btn" id="tag-expand-btn" onclick="toggleTags()">
            <iconify-icon icon="solar:alt-arrow-down-linear"></iconify-icon>
        </div>
    </div>

    <div class="slider-wrapper">
        <div class="slider-track" id="slider-track">
            <div class="tab-content" id="list-daily"></div>
            <div class="tab-content" id="list-event"></div>
            <div class="tab-content" id="list-au"></div>
            <div class="tab-content" id="list-ooc"></div>
        </div>
    </div>
</div>

<script>
    let activeCategoryIndex = 0;
    let selectedTag = 'all';
    let searchQueryStr = '';
    let tagsExpanded = false;

    const track = document.getElementById('slider-track');
    const tabs = document.querySelectorAll('.tab-item');
    const tagPools = document.querySelectorAll('.tag-filter-pool');
    const tagExpandBtn = document.getElementById('tag-expand-btn');
    const searchInput = document.getElementById('memory-search-input');
    
    let allCardDataElements = [];

    // 스크롤 시 부드럽게 나타나는 옵저버 (애니메이션 충돌 방지)
    const cardObserver = new IntersectionObserver((entries) => {
        let delayCount = 0;
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const card = entry.target;
                if (!card.classList.contains('show')) {
                    setTimeout(() => { card.classList.add('show'); }, delayCount * 50);
                    delayCount++;
                }
            }
        });
    }, { threshold: 0.05 });

    function toggleTags() {
        tagsExpanded = !tagsExpanded;
        const activePool = tagPools[activeCategoryIndex];
        if(tagsExpanded) {
            activePool.classList.add('expanded');
            tagExpandBtn.classList.add('active');
        } else {
            activePool.classList.remove('expanded');
            tagExpandBtn.classList.remove('active');
        }
    }

    function checkTagWrap() {
        const activePool = tagPools[activeCategoryIndex];
        if (!activePool) return;
        activePool.style.maxHeight = 'none';
        const isWrapping = activePool.scrollHeight > 35;
        activePool.style.maxHeight = '';
        tagExpandBtn.style.display = isWrapping ? 'flex' : 'none';
    }
    window.addEventListener('resize', checkTagWrap);

    // 🔥 탭 변경 시 리스트 튀는 현상 제거 (수직 이동 없이 가로 슬라이드만)
    function switchTab(index) {
        if (activeCategoryIndex === index) return;
        activeCategoryIndex = index;
        
        tabs.forEach(tab => tab.classList.remove('active'));
        tabs[index].classList.add('active');
        
        tagPools.forEach(pool => { pool.classList.remove('active'); pool.classList.remove('expanded'); });
        tagPools[index].classList.add('active');
        
        tagsExpanded = false; tagExpandBtn.classList.remove('active');
        checkTagWrap();
        
        track.style.transform = `translateX(-${index * 25}%)`;
        
        selectedTag = 'all'; searchInput.value = ''; searchQueryStr = '';
        executeMasterFilter();
    }

    function filterByTag(tagName) {
        selectedTag = tagName;
        executeMasterFilter();
    }

    function getCategoryKeyByIndex(index) {
        if(index === 0) return 'daily';
        if(index === 1) return 'event';
        if(index === 2) return 'au';
        return 'ooc';
    }

    function executeMasterFilter() {
        const currentActivePool = tagPools[activeCategoryIndex];
        const buttons = currentActivePool.querySelectorAll('.filter-tag-btn');
        buttons.forEach(btn => {
            const btnText = btn.textContent.replace('#', '').trim();
            if(btnText === selectedTag.toUpperCase()) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        allCardDataElements.forEach(cardPack => {
            const el = cardPack.domElement;
            const categoryMatch = (cardPack.category === getCategoryKeyByIndex(activeCategoryIndex));
            const tagMatch = (selectedTag === 'all' || cardPack.tags.includes(selectedTag));
            const searchMatch = (searchQueryStr === '' || cardPack.searchBlob.includes(searchQueryStr));

            if(categoryMatch && tagMatch && searchMatch) {
                if (el.style.display === 'none') {
                    el.style.display = 'flex';
                    // 가로 슬라이드 중 애니메이션 충돌을 막기 위해 튀지 않게 처리
                    if(!el.classList.contains('show')) el.classList.add('show');
                }
            } else {
                el.style.display = 'none';
            }
        });
    }

    // 🔥 아코디언(접은 글) 토글 함수
    window.toggleAccordion = function(id) {
        allCardDataElements.forEach(pack => {
            const el = pack.domElement;
            if(pack.id === id) {
                el.classList.toggle('open');
            } else {
                // 다른 카드가 열리면 기존에 열려있던 카드는 닫히게 (깔끔한 UI 유지)
                el.classList.remove('open');
            }
        });
    }

    searchInput.addEventListener('input', (e) => {
        searchQueryStr = e.target.value.toLowerCase().trim();
        executeMasterFilter();
    });

    document.addEventListener('DOMContentLoaded', () => {
        const tagsTracker = { daily: {}, event: {}, au: {}, ooc: {} };

        fetch('../memory/list.html')
            .then(res => res.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const items = doc.querySelectorAll('.memory-data');

                items.forEach((item) => {
                    const id = item.getAttribute('data-id');
                    const category = item.getAttribute('data-category') || 'daily';
                    const rawTags = item.getAttribute('data-tag') || '';
                    const date = item.getAttribute('data-date') || '';
                    
                    const title = item.querySelector('.memory-title').innerHTML;
                    const summaryEl = item.querySelector('.memory-summary');
                    const summary = summaryEl ? summaryEl.innerHTML.trim() : '';

                    const processedTagsArray = [];
                    if(rawTags.trim() !== "") {
                        rawTags.split(',').forEach(t => {
                            const cleaned = t.trim();
                            if(cleaned) {
                                if(tagsTracker[category]) {
                                    tagsTracker[category][cleaned] = (tagsTracker[category][cleaned] || 0) + 1;
                                    processedTagsArray.push(cleaned);
                                }
                            }
                        });
                    }

                    const card = document.createElement('div');
                    card.className = 'text-card';
                    card.setAttribute('data-card-id', id);
                    
                    // 🔥 접은 글 UI 구조 반영 (card-body와 card-body-inner 추가)
                    card.innerHTML = `
                        <div class="card-header" onclick="toggleAccordion('${id}')">
                            <div class="text-title">${title}</div>
                            ${date ? `<div class="text-date">${date}</div>` : ''}
                        </div>
                        <div class="card-body">
                            <div class="card-body-inner">
                                ${summary ? `<div class="text-summary">${summary}</div>` : ''}
                                <div class="highlight-thread-box" id="thread-${id}"></div>
                            </div>
                        </div>
                    `;

                    const cardPack = {
                        id: id, category: category, tags: processedTagsArray, 
                        searchBlob: `${title} ${summary} ${date} ${processedTagsArray.join(' ')}`.toLowerCase(), 
                        domElement: card
                    };
                    allCardDataElements.push(cardPack);

                    const targetContainer = document.getElementById(`list-${category}`);
                    if(targetContainer) {
                        targetContainer.appendChild(card);
                        cardObserver.observe(card);
                    }

                    fetch(`../memory/dialog/${id}.html`)
                        .then(res => { if(res.ok) return res.text(); return ''; })
                        .then(dialogHtml => {
                            if(!dialogHtml) return;
                            
                            const dialogDoc = parser.parseFromString(dialogHtml, 'text/html');
                            const highlightSpans = dialogDoc.querySelectorAll('span[style*="background-color"]');
                            
                            const threadBox = document.getElementById(`thread-${id}`);
                            let extractedTextForSearch = '';

                            if(highlightSpans.length > 0) {
                                highlightSpans.forEach(span => {
                                    const text = span.textContent.trim();
                                    if(text) {
                                        extractedTextForSearch += text + ' ';
                                        const highlightItem = document.createElement('div');
                                        highlightItem.className = 'highlight-item';
                                        highlightItem.innerHTML = span.outerHTML; 
                                        threadBox.appendChild(highlightItem);
                                    }
                                });
                            } else {
                                threadBox.style.display = 'none'; 
                            }
                            
                            cardPack.searchBlob += ` ${extractedTextForSearch.toLowerCase()}`;
                        }).catch(() => {
                            document.getElementById(`thread-${id}`).style.display = 'none';
                        });
                });

                Object.keys(tagsTracker).forEach(catKey => {
                    const poolContainer = document.getElementById(`tag-pool-${catKey}`);
                    if(!poolContainer) return;
                    const sortedTags = Object.keys(tagsTracker[catKey]).sort((a, b) => {
                        return tagsTracker[catKey][b] - tagsTracker[catKey][a];
                    });

                    sortedTags.forEach(tagName => {
                        const btn = document.createElement('div');
                        btn.className = 'filter-tag-btn';
                        btn.textContent = `#${tagName.toUpperCase()}`;
                        btn.onclick = () => filterByTag(tagName);
                        poolContainer.appendChild(btn);
                    });
                });

                setTimeout(checkTagWrap, 150); 
            })
            .catch(err => console.error('텍스트 리스트 로드 실패:', err));
    });
</script>
</body>
</html>
